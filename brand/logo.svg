<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Логотип radilov-spsu</title>
  <desc id="desc">Три симметрично расположенных связанных объекта и три параллельных потока</desc>

  <rect width="512" height="512" fill="#101827"/>

  <!-- Связи образуют устойчивую зеркально-симметричную систему. -->
  <path d="M256 152 C256 218 176 244 176 332
           M256 152 C256 218 336 244 336 332
           M176 332 C218 332 220 272 256 272 C292 272 294 332 336 332"
        fill="none" stroke="#55DDE0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Три параллельных потока. -->
  <path d="M104 152 H408 M104 256 H408 M104 352 H408"
        fill="none" stroke="#55DDE0" stroke-width="22" stroke-linecap="round"/>

  <!-- Объекты/узлы проектируемой системы. -->
  <rect x="206" y="116" width="100" height="72" rx="22" fill="#FFB84D"/>
  <rect x="126" y="316" width="100" height="72" rx="22" fill="#FFB84D"/>
  <rect x="286" y="316" width="100" height="72" rx="22" fill="#FFB84D"/>

  <!-- Ядра объектов сохраняют ритм потоков в малом размере. -->
  <circle cx="256" cy="152" r="16" fill="#101827"/>
  <circle cx="176" cy="352" r="16" fill="#101827"/>
  <circle cx="336" cy="352" r="16" fill="#101827"/>
</svg>
