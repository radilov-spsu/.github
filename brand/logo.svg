<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Логотип radilov-spsu</title>
  <desc id="desc">Шестиугольник с тремя портами — приложение, отделённое от внешнего мира границей</desc>

  <rect width="512" height="512" fill="#101827"/>

  <!-- Гексагональная архитектура: приложение внутри границы. -->
  <polygon points="256,88 110.5,172 110.5,340 256,424 401.5,340 401.5,172"
           fill="none" stroke="#55DDE0" stroke-width="30" stroke-linejoin="round"/>

  <!-- Порты: точки, в которых система разговаривает с внешним миром.
       Стоят на вершинах и перекрывают стыки контура. -->
  <circle cx="256" cy="88" r="34" fill="#FFB84D"/>
  <circle cx="110.5" cy="340" r="34" fill="#FFB84D"/>
  <circle cx="401.5" cy="340" r="34" fill="#FFB84D"/>
</svg>
